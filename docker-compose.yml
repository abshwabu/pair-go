services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pair-backend
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/pair.db
      - TOKEN_EXPIRY_DAYS=30
      - TOKEN_BYTE_LENGTH=32
      - S3_ENDPOINT=
      - S3_BUCKET=pair-media
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=
      - S3_SECRET_KEY=
      - S3_USE_SSL=false
      - S3_PUBLIC_BASE_URL=http://localhost:9000/pair-media
      - FCM_CREDENTIALS_JSON=
      - FCM_PROJECT_ID=
    volumes:
      - pair_data:/data
    restart: unless-stopped

volumes:
  pair_data:
    name: pair_data
